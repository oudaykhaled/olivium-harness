[project]
name = "harnessforge-graphiti-worker"
version = "0.1.0"
description = "Private bounded Graphiti IPC adapter; Elixir owns authority and egress"
requires-python = ">=3.12,<3.13"
dependencies = ["graphiti-core==0.31.2", "httpx==0.28.1", "pydantic>=2.11.5,<3", "openai>=1.91.0"]

[dependency-groups]
dev = ["pytest>=8.3.3,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.uv]
package = false
constraint-dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.16.0",
    "backoff==2.2.1",
    "certifi==2026.10.23",
    "charset-normalizer==3.5.2",
    "distro==1.9.0",
    "graphiti-core==0.31.2",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpcore2==2.16.0",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "idna==3.20",
    "iniconfig==2.3.1",
    "jiter==0.18.0",
    "neo4j==6.4.1",
    "numpy==2.5.4",
    "openai==3.42.1",
    "packaging==26.3",
    "pluggy==1.7.0",
    "posthog==7.82.1",
    "pydantic==2.14.2",
    "pydantic_core==2.50.2",
    "Pygments==2.21.0",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "python-dotenv==1.2.4",
    "pytz==2026.6",
    "requests==2.34.2",
    "sniffio==1.3.1",
    "tenacity==9.2.1",
    "truststore==0.10.5",
    "typing_extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.8.0",
    "uv==0.9.7",
]

[tool.uv.sources]
graphiti-core = { path = "vendor/graphiti_core-0.31.2-py3-none-any.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["backend: actual isolated Neo4j qualification; requires root-supplied boot JSON"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
