# Source-owned managed requirements. Never supplied by a model or exported project.
allowed_approval_policies = ["untrusted"]
allowed_approvals_reviewers = ["user"]
allowed_web_search_modes = ["disabled"]
default_permissions = "hf_candidate"
allow_login_shell = false
check_for_update_on_startup = false

[allowed_permission_profiles]
hf_candidate = true

[features]
unified_exec = false
shell_tool = true
unified_exec_tty = false
shell_zsh_fork = false
shell_snapshot = false
shell_snapshot_v2 = false
hooks = false
exec_permission_approvals = false
request_permissions_tool = false
view_image = false
use_legacy_landlock = false

[permissions.filesystem]
deny_read = ["/etc/codex", "/opt/harnessforge-codex", "/runtime", "/run/harnessforge", "/home/harnessforge/.codex", "/proc"]

[permissions.hf_candidate.workspace_roots]
"/candidate" = true

[permissions.hf_candidate.filesystem]
"/" = "read"
"/candidate" = "write"
"/candidate/.codex" = "read"
"/candidate/.agents" = "read"
"/candidate/AGENTS.md" = "read"

[permissions.hf_candidate.network]
enabled = false
