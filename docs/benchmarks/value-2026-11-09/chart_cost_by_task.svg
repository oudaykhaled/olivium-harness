<text class="t" x="16" y="26">Average cost per run, by task and arm</text>
<text class="p" x="16" y="44">Each dot is one task and arm, averaged over its repeats.</text>
<text class="p" x="16" y="60">Pilot: 5 tasks, one model, one agent. This can show a direction or a problem. It cannot prove a general effect.</text>
