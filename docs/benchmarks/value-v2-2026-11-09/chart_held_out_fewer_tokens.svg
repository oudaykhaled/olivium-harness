<text class="p" x="16" y="44">Dot: median across tasks. Line: 95% bootstrap interval. Faint dots: individual tasks.</text>
<text class="p" x="16" y="60">Held-out measurement: 3 tasks, one model, one agent. This can show a direction or a problem. It cannot prove a general effect.</text>
